name: Deploy

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call personal-site deployment workflow
        uses: fawques/personal-site/.github/workflows/deploy-project.yml@main
        with:
          project_name: meatproxybot
          gcp_project: ${{ vars.GCP_PROJECT_ID }}
          port: "3000"
          title: MeatProxyBot
          description: Slack meat proxy bot with multi-workspace OAuth support
          repo_url: https://github.com/fawques/meatproxybot
          public_routes: /slack/* /healthz
          env_secrets: PUBLIC_BASE_URL SLACK_SIGNING_SECRET SLACK_CLIENT_ID SLACK_CLIENT_SECRET SLACK_STATE_SECRET INSTALLATION_ENCRYPTION_KEY
        secrets:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check environment variable
        run: |
          if [ -z "${{ vars.PUBLIC_BASE_URL }}" ]; then
            echo "ERROR: vars.PUBLIC_BASE_URL is not set"
            exit 1
          fi
          echo "PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}"

      - name: Verify health endpoint
        run: |
          set +e
          for attempt in {1..15}; do
            echo "Attempt $attempt: checking health endpoint..."
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 "${{ vars.PUBLIC_BASE_URL }}/healthz"; then
              echo "Health check passed"
              exit 0
            fi
            if [ $attempt -lt 15 ]; then
              sleep 6
            fi
          done
          echo "Health endpoint check failed after 15 attempts"
          exit 1

      - name: Verify events endpoint returns 401 for unsigned requests
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --proto '=https' --tlsv1.2 \
            -X POST \
            "${{ vars.PUBLIC_BASE_URL }}/slack/events")
          if [ "$status" = "401" ]; then
            echo "Events endpoint correctly returned 401 for unsigned request"
            exit 0
          else
            echo "Expected 401 but got $status"
            exit 1
          fi
