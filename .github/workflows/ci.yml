name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meatproxybot .
      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id meatproxybot -u)
          test "$uid" -ne 0
      - name: Exits non-zero with the missing-env message without configuration
        run: |
          if out=$(docker run --rm meatproxybot 2>&1); then
            echo "expected a non-zero exit without SLACK_* env" >&2
            exit 1
          fi
          echo "$out"
          grep -q 'Invalid configuration' <<<"$out"
