# Slack app manifest for meatproxybot. Create the app from this file at
# https://api.slack.com/apps -> Create New App -> From a manifest.
# It declares everything the MVP needs, so the app is created once.
#
# Before creating the app, replace the placeholder base URL
# `https://meatproxybot.example.com` below with the bot's public base URL.
# In production that is `https://api.<domain>/meatproxybot`, so the request
# URL becomes `https://api.<domain>/meatproxybot/slack/events`.
display_information:
  name: meatproxybot
  description: Nudge teammates to read AI-generated text before they paste it.
  long_description: >-
    meatproxybot helps teams catch AI-generated content before it's shared.
    Trigger it by reacting to a message with 🥩, using the message shortcut,
    or typing /meatproxy with a message link. The bot posts a light-hearted
    reminder in the message's thread, asking the poster to review what they're
    sharing. The person who triggered it stays anonymous, but the original
    poster is mentioned so they know to read their message.
  background_color: "#8b1a1a"
features:
  bot_user:
    display_name: meatproxybot
    always_online: true
  slash_commands:
    - command: /meatproxy
      description: Call out a message as unread AI output
      usage_hint: <message link>
      should_escape: false
  shortcuts:
    - name: "🥩 Call out meat proxy"
      type: message
      callback_id: call_out_meat_proxy
      description: Call out this message as unread AI output
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:read
      - reactions:write
      - commands
      - channels:history
      - groups:history
  redirect_urls:
    - https://meatproxybot.example.com/slack/oauth_redirect
settings:
  event_subscriptions:
    bot_events:
      - reaction_added
      - app_uninstalled
      - tokens_revoked
    request_url: https://meatproxybot.example.com/slack/events
  interactivity:
    is_enabled: true
    request_url: https://meatproxybot.example.com/slack/events
  slash_commands_url: https://meatproxybot.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
